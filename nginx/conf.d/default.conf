server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    # OTel: 各 location でカスタム属性を付ける
    otel_span_attr "http.route" $uri;
    otel_span_attr "lab.variant" "official-contrib";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # OTel: PHP-FPM への伝搬は traceparent ヘッダで自動
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # 親 trace を php-fpm に渡す
        fastcgi_param HTTP_TRACEPARENT $http_traceparent;
        fastcgi_param HTTP_TRACESTATE $http_tracestate;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
