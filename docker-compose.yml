name: laravel-otel-lab

services:
  # ====== アプリケーションスタック ======
  nginx:
    build:
      context: ./nginx
    container_name: lab-nginx
    ports:
      - "8080:80"   # 公式 contrib-auto-laravel
      - "8081:81"   # keepsuit/laravel-opentelemetry
    volumes:
      - ./laravel:/var/www/html:ro
      - ./laravel-v2:/var/www-v2/html:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d/v2.conf:/etc/nginx/conf.d/v2.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - php
      - php-v2
      - otel-collector
    networks:
      - lab

  php:
    build:
      context: ./php
    container_name: lab-php
    volumes:
      - ./laravel:/var/www/html
      - ./php/conf.d/zz-otel.ini:/usr/local/etc/php/conf.d/zz-otel.ini:ro
      - ./php/php-fpm.d/www.conf:/usr/local/etc/php-fpm.d/zz-www.conf:ro
    environment:
      # OTel auto-instrumentation
      OTEL_PHP_AUTOLOAD_ENABLED: "true"
      OTEL_SERVICE_NAME: laravel-app
      OTEL_SERVICE_VERSION: "1.0.0"
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_TRACES_SAMPLER: parentbased_always_on
      # Laravel
      APP_KEY: base64:Hk5Y3qm7g8WJZqkgQ7Pl2KQrgUaDk8wPp4Yqj7BFr0o=
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      LOG_CHANNEL: stack
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      # Queue / Cache (sync で即実行 → トレース化されやすい)
      QUEUE_CONNECTION: sync
      CACHE_STORE: database
    depends_on:
      - postgres
      - otel-collector
    networks:
      - lab

  php-v2:
    build:
      context: ./php
    container_name: lab-php-v2
    volumes:
      - ./laravel-v2:/var/www/html
      - ./php/conf.d/zz-otel.ini:/usr/local/etc/php/conf.d/zz-otel.ini:ro
      - ./php/php-fpm.d/www.conf:/usr/local/etc/php-fpm.d/zz-www.conf:ro
    environment:
      OTEL_PHP_AUTOLOAD_ENABLED: "true"
      OTEL_SERVICE_NAME: laravel-app-keepsuit
      OTEL_SERVICE_VERSION: "1.0.0"
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_TRACES_SAMPLER: parentbased_always_on
      APP_KEY: base64:Hk5Y3qm7g8WJZqkgQ7Pl2KQrgUaDk8wPp4Yqj7BFr0o=
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8081
      LOG_CHANNEL: stack
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: laravel_v2
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      QUEUE_CONNECTION: sync
      CACHE_STORE: database
    depends_on:
      - postgres
      - otel-collector
    networks:
      - lab

  postgres:
    image: postgres:16-alpine
    container_name: lab-postgres
    environment:
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: laravel
      POSTGRES_MULTIPLE_DATABASES: laravel,laravel_v2
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:ro
    networks:
      - lab

  # ====== OpenTelemetry スタック ======
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    container_name: lab-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector metrics
      - "13133:13133" # Health check
    depends_on:
      - tempo
    networks:
      - lab

  tempo:
    image: grafana/tempo:2.6.1
    container_name: lab-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API
    networks:
      - lab

  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: lab-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver       # OTel Collector → Prometheus 経路用
      - --enable-feature=exemplar-storage         # exemplar (trace への deeplink) 有効化
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - lab

  grafana:
    image: grafana/grafana:11.3.0
    container_name: lab-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - tempo
    networks:
      - lab

volumes:
  postgres-data:
  tempo-data:
  grafana-data:
  prometheus-data:

networks:
  lab:
    driver: bridge
