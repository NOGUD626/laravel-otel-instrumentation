receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  resource:
    attributes:
      - key: collector.instance
        value: lab-otel-collector
        action: insert

# Connectors: span を入力に取り、metrics として吐き出す
connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [2ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
    # spanmetrics に含める dimension (Grafana で group_by できる)
    dimensions:
      - name: http.method
      - name: http.status_code
      - name: http.route
      - name: http.target
      - name: http.url
    exemplars:
      enabled: true
    exclude_dimensions: ['status.code']
    dimensions_cache_size: 1000
    aggregation_temporality: "AGGREGATION_TEMPORALITY_CUMULATIVE"
    metrics_flush_interval: 15s
    metrics_expiration: 5m
    resource_metrics_key_attributes:
      - service.name
      - telemetry.sdk.language
      - telemetry.sdk.name

exporters:
  # Tempo へ trace
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Prometheus へ metrics (remote write)
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    # トレース: 入ってきた spans を Tempo に流しつつ、spanmetrics connector にもコピー
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp/tempo, spanmetrics, debug]

    # メトリクス: spanmetrics connector が生成したものを Prometheus に
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [resource, batch]
      exporters: [prometheusremotewrite, debug]

    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug]

  telemetry:
    metrics:
      address: 0.0.0.0:8888
